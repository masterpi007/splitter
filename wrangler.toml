name = "splitter"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

[[kv_namespaces]]
binding = "SPLITTER_KV"
id = "d39351a8dc64417c879863e174de9c8b"

# WebAuthn RP identity (rpID/origin/name) is derived from the request URL —
# see functions/api/utils/rp.ts — so no RP_* vars are needed here.
# Secrets live in the dashboard (Pages → Settings → Variables and Secrets)
# or `wrangler pages secret put`:
# - JWT_SECRET: random string ≥32 chars, signs session cookies
# - VAPID_PRIVATE_KEY: pairs with VAPID_PUBLIC_KEY below
# - TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET: only if the Telegram bot is used

[vars]
VAPID_PUBLIC_KEY = "BGk9DjrVqgTy7XjrVKRGEBVEIOxn1tXfMwQeIduK6xoY1xKxgjXdqfK_nftr9D4FfMouID5SdPcWPpsirn8hO2E"
VAPID_SUBJECT = "mailto:admin@split.masterpi.me"

# App-wide admins (comma-separated userIds). Grants cross-group privileges such
# as recovering any member's passkey. Currently: "TA".
APP_ADMIN_USER_IDS = "146580ad-5c20-4f0b-9c35-ffd3b6180340"

[ai]
binding = "AI"
