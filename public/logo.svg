<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Chia: seed cluster splitting apart along the diagonal -->
  <circle cx="50" cy="50" r="45" fill="#1f2937"/>
  <!-- upper-left cluster -->
  <g fill="#22d3ee">
    <ellipse cx="31" cy="31" rx="6" ry="9" transform="rotate(-30 31 31)"/>
    <ellipse cx="47" cy="23" rx="6" ry="9" transform="rotate(20 47 23)"/>
    <ellipse cx="24" cy="49" rx="6" ry="9" transform="rotate(-65 24 49)"/>
    <ellipse cx="42" cy="41" rx="6" ry="9" transform="rotate(-20 42 41)"/>
  </g>
  <!-- lower-right cluster, drifting away -->
  <g fill="#06b6d4">
    <ellipse cx="70" cy="55" rx="6" ry="9" transform="rotate(35 70 55)"/>
    <ellipse cx="57" cy="71" rx="6" ry="9" transform="rotate(75 57 71)"/>
    <ellipse cx="74" cy="73" rx="6" ry="9" transform="rotate(15 74 73)"/>
  </g>
  <!-- lone seed mid-split -->
  <ellipse cx="57" cy="45" rx="5" ry="7.5" transform="rotate(50 57 45)" fill="#0e7490"/>
</svg>
